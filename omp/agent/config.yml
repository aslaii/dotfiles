providers:
  webSearchOrder:
    []
disabledProviders:
  - agent-plugins
  - agents-md
  - agents
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - mcp-json
  - opencode
  - ssh-json
  - vscode
  - windsurf
modelRoles:
  default: openai-codex/gpt-6-astra:medium
  plan: openai-codex/gpt-6-astra:max
  task: anthropic/claude-sonnet-5:high
  slow: openai-codex/gpt-6-astra:max
  smol: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  vision: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  designer: anthropic/claude-opus-5:high
  commit: opencode-zen/muse-spark-1.3-contributor-free:medium
  tiny: opencode-zen/muse-spark-1.3-contributor-free:medium
  planner: openai-codex/gpt-6-astra:max
  advisor: anthropic/claude-sonnet-5:medium
  review: anthropic/claude-opus-5:xhigh
  verify: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  research: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  free: opencode-zen/muse-spark-1.3-contributor-free:xhigh
defaultThinkingLevel: medium
advisor:
  enabled: false
prewalk:
  enabled: false
task:
  maxConcurrency: 2
  maxRecursionDepth: 1
  maxEffort: max
  enableEffort: false
  enableLsp: true
  prewalk: false
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@tiny"
    reviewer: "@review"
    security-reviewer: "@review"
    terra: "@slow"
    planner: "@planner"
    verifier: "@verify"
    researcher: "@research"
retry:
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  modelFallback: true
  fallbackRevertPolicy: never
  fallbackChains:
    default:
      - anthropic/claude-sonnet-5:medium
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    openai-codex/*:
      - anthropic/claude-sonnet-5:medium
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    anthropic/claude-opus-5:
      - anthropic/claude-sonnet-5:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    anthropic/*:
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    opencode-zen/muse-spark-1.3-contributor-free:
      - anthropic/claude-sonnet-5:high
      - openai-codex/gpt-5.6-sol:high
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: dark-catppuccin
  light: light-catppuccin
disabledExtensions:
  []
browser:
  headless: true
dev:
  autoqaConsent: granted