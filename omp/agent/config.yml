disabledProviders:
  - agent-plugins
  - claude
  - claude-md
  - claude-plugins
  - mcp-json
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  plan: anthropic/claude-sonnet-5:high
  task: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  smol: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  vision: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  designer: anthropic/claude-sonnet-5:high
  commit: opencode-zen/muse-spark-1.3-contributor-free:medium
  tiny: opencode-zen/muse-spark-1.3-contributor-free:medium
  planner: anthropic/claude-sonnet-5:high
  advisor: openai-codex/gpt-5.6-sol:medium
  review: anthropic/claude-sonnet-5:high
  verify: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  research: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  free: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  PREWALK: anthropic/claude-sonnet-5:high
defaultThinkingLevel: medium
task:
  maxConcurrency: 32
  maxRecursionDepth: 1
  enableLsp: true
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@tiny"
    reviewer: "@review"
    security-reviewer: "@review"
    terra: "@slow"
    planner: "@planner"
    verifier: "@verify"
    researcher: "@research"
retry:
  usageAwareFallback: true
  usageReservePolicy: auto
  fallbackRevertPolicy: never
  fallbackChains:
    default:
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    openai-codex/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    anthropic/claude-sonnet-5:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    anthropic/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    opencode-zen/muse-spark-1.3-contributor-free:
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    commandcode/deepseek/deepseek-v4.1-flash:
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light-catppuccin
dev:
  autoqaConsent: granted
setupVersion: 2
hideThinkingBlock: true
statusLine:
  preset: custom
  showHookStatus: false
  leftSegments:
    - status
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
    - cache_hit
    - cache_read