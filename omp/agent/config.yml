disabledProviders:
  - agent-plugins
  - claude
  - claude-md
  - claude-plugins
  - mcp-json
modelRoles:
  default: openai-codex/gpt-5.6-sol:medium
  plan: openai-codex/gpt-5.6-sol:high
  planner: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  task: commandcode/deepseek/deepseek-v4.1-flash:high
  smol: commandcode/deepseek/deepseek-v4.1-flash:medium
  research: commandcode/deepseek/deepseek-v4.1-flash:medium
  tiny: commandcode/deepseek/deepseek-v4.1-flash:low
  commit: commandcode/deepseek/deepseek-v4.1-flash:low
  review: anthropic/claude-sonnet-5:high
  verify: anthropic/claude-sonnet-5:medium
  vision: anthropic/claude-sonnet-5:medium
  advisor: anthropic/claude-sonnet-5:medium
  free: opencode-zen/muse-spark-1.3-contributor-free:medium
defaultThinkingLevel: medium
task:
  maxConcurrency: 16
  maxRecursionDepth: 1
  enableLsp: true
  enableEffort: false
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@tiny"
    reviewer: "@review"
    security-reviewer: "@review"
    terra: "@slow"
    planner: "@planner"
    verifier: "@verify"
    researcher: "@research"
  isolation:
    commits: ai
retry:
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - anthropic/claude-sonnet-5:medium
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    plan:
      - anthropic/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    planner:
      - anthropic/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    slow:
      - anthropic/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    task:
      - opencode-zen/muse-spark-1.3-contributor-free:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
      - anthropic/claude-sonnet-5:medium
      - openai-codex/gpt-5.6-sol:medium
    smol:
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:medium
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-5.6-sol:low
    research:
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:high
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-5.6-sol:medium
    tiny:
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:medium
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-5.6-sol:low
    commit:
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:medium
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-5.6-sol:low
    review:
      - openai-codex/gpt-5.6-sol:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    verify:
      - openai-codex/gpt-5.6-sol:medium
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    vision:
      - openai-codex/gpt-5.6-sol:medium
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    advisor:
      - openai-codex/gpt-5.6-sol:medium
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:medium
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    free:
      []
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light-catppuccin
dev:
  autoqaConsent: granted
setupVersion: 2
hideThinkingBlock: true
statusLine:
  preset: custom
  showHookStatus: false
  leftSegments:
    - status
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
    - cache_hit
    - cache_read
browser:
  cmux: false
plan:
  autosave: true
lsp:
  diagnosticsOnEdit: true