disabledProviders:
  - agent-plugins
  - claude
  - claude-md
  - claude-plugins
  - commandcode
  - mcp-json
  - opencode-zen
disabledExtensions:
  - extension-module:pi-extension
  - extension-module:extensions
  - extension-module:rcg
  - extension-module:moshi-hooks
  - extension-module:rtk
skills:
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: true
  enableAgentsProject: false
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  includeSkills:
    - ponytail
    - caveman
    - axe
    - mobii-ship
    - mobii-update
    - agent-browser
edit:
  mode: apply_patch
modelRoles:
  plan: anthropic/claude-opus-5-5:high
  planner: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:high
  task: anthropic/claude-sonnet-5-5:high
  smol: openai-codex/gpt-6-luna:low
  research: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:low
  commit: openai-codex/gpt-6-luna:low
  review: anthropic/claude-sonnet-5-5:high
  verify: anthropic/claude-sonnet-5-5:medium
  vision: anthropic/claude-sonnet-5-5:medium
  advisor: anthropic/claude-sonnet-5-5:medium
  free: opencode-go/muse-spark-1.3-contributor:medium
defaultThinkingLevel: medium
tier:
  openai: priority
  subagent: inherit
task:
  disabledAgents:
    - terra
    - verifier
    - researcher
    - planner
  maxConcurrency: 16
  maxRecursionDepth: 1
  enableLsp: true
  enableEffort: false
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@tiny"
    reviewer: "@review"
    security-reviewer: "@review"
    terra: "@slow"
    planner: "@planner"
    verifier: "@verify"
    researcher: "@research"
  isolation:
    commits: ai
retry:
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - opencode-go/deepseek-v4.1-flash:high
    plan:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/glm-5.3-flash:max
    planner:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/glm-5.3-flash:max
    slow:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/glm-5.3-flash:max
    review:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/glm-5.3-flash:high
    verify:
      - openai-codex/gpt-6.1-sol:medium
      - opencode-go/deepseek-v4.1-flash:high
    vision:
      - openai-codex/gpt-6.1-sol:medium
      - opencode-go/deepseek-v4.1-flash:high
    advisor:
      - openai-codex/gpt-6.1-sol:medium
      - opencode-go/glm-5.3-flash:high
    task:
      - openai-codex/gpt-6.1-sol:high
      - opencode-go/deepseek-v4.1-flash:high
    smol:
      - opencode-go/glm-5.3-flash:low
    research:
      - opencode-go/glm-5.3-flash:low
    tiny:
      - opencode-go/glm-5.3-flash:low
    commit:
      - opencode-go/muse-spark-1.3-contributor:medium
    free:
      []
symbolPreset: nerd
theme:
  dark: dark-catppuccin
  light: light-catppuccin
dev:
  autoqaConsent: granted
setupVersion: 2
hideThinkingBlock: false
statusLine:
  showHookStatus: false
  leftSegments:
    - status
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
    - cache_hit
    - cache_read
  preset: full
  transparent: false
browser:
  cmux: false
plan:
  autosave: true
lsp:
  diagnosticsOnEdit: true
composer:
  tokenRate: true
display:
  subagentLivePreview: true
codexResets:
  autoRedeem: "no"