# omp-budget opt-in overlay (native `--config` overlay, no source edits).
#
# Stack: Claude Sonnet 5 through the $20/mo Claude subscription's OAuth
# credential (`claude-sdk-oauth`, provider `anthropic`) first for the
# driving roles, Command Code $10 plan DeepSeek tier
# (commandcode/deepseek/deepseek-v4.1-flash) once Claude's usage-aware
# preflight reports the account inside its reserve margin, the plan-hosted
# Muse Spark 1.3 Contributor (commandcode/meta/muse-spark-1.3-contributor)
# for grunt lanes, free OpenCode Zen Muse Contributor as last-resort
# backstop. No x-cmd-zdr header (opt-in on Command Code; most models
# default to ZDR; forcing it caps a model at the plan's default allowance).
# No OpenAI/GPT model or paid Zen model in this file.
#
#   omp --config /Users/aslaii/dotfiles/omp/budget.yml ...
# or through the shell function:
#   omp-budget
#
# Precedence (src/config/settings.ts #rebuildMerged): global config.yml <
# project settings < THIS overlay < runtime overrides. Nested objects merge
# per key, so only the roles/chains named here change; everything else
# (disabledProviders, plugins, UI, thinking levels) is inherited untouched.
modelRoles:
  # Reasoning-heavy work -> Claude Sonnet 5 (subscription quota) first.
  plan: anthropic/claude-sonnet-5:high
  planner: anthropic/claude-sonnet-5:high
  slow: anthropic/claude-sonnet-5:high
  review: anthropic/claude-sonnet-5:high
  # Designer stays on the plan's DeepSeek tier: highest-volume iterative
  # role here, no concrete reason to spend subscription quota on it, and the
  # global profile already gives designer its own Claude routing (Opus-5)
  # when the caller wants that instead of this budget overlay.
  designer: commandcode/deepseek/deepseek-v4.1-flash:max
  task: anthropic/claude-sonnet-5:medium
  # Advisor stays off Claude: high turn volume, long-running threads.
  advisor: commandcode/deepseek/deepseek-v4.1-flash:high
  # Main stays on Claude's mid tier too.
  default: anthropic/claude-sonnet-5:medium
  # Vision reads stay off Claude: the plan's dedicated, image-probe-verified
  # vision model is image-native and cheaper per call.
  vision: commandcode/deepseek/deepseek-v4-flash-vision-exp:high
  # Grunt work -> plan-hosted Muse Contributor, the plan's cheapest capable model.
  smol: commandcode/meta/muse-spark-1.3-contributor:xhigh
  commit: commandcode/meta/muse-spark-1.3-contributor:medium
  tiny: commandcode/meta/muse-spark-1.3-contributor:medium
  verify: commandcode/meta/muse-spark-1.3-contributor:xhigh
  research: commandcode/meta/muse-spark-1.3-contributor:xhigh
  free: commandcode/meta/muse-spark-1.3-contributor:xhigh
retry:
  # Hard-require the fallback machinery (startup resolution is gated on this).
  modelFallback: true
  # Usage-aware preflight, same keys/values as agent/config.yml's global
  # profile (settings-schema.ts #1912-1970): before a call on a coding-plan
  # model, check the active credential's remaining usage; below the 10%
  # reserve margin count as low, and with policy "auto" silently advance to
  # the next `fallbackChains` entry instead of erroring or prompting.
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  fallbackChains:
    default:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    commandcode/deepseek/deepseek-v4.1-flash:
      - commandcode/deepseek/deepseek-v4-pro:max
      - commandcode/deepseek/deepseek-v4-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/deepseek/deepseek-v4-pro:
      - commandcode/deepseek/deepseek-v4.1-flash:max
      - commandcode/deepseek/deepseek-v4-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/deepseek/deepseek-v4-flash-vision-exp:
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/deepseek/deepseek-v4.1-flash:medium
    commandcode/deepseek/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    # Claude Sonnet 5 -> Command Code DeepSeek plan tier -> plan-hosted Muse.
    anthropic/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
    openai-codex/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/meta/muse-spark-1.3-contributor:
      - commandcode/deepseek/deepseek-v4.1-flash:medium
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    opencode-zen/muse-spark-1.3-contributor-free:
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
      - commandcode/deepseek/deepseek-v4.1-flash:high
    opencode-zen/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
statusLine:
  preset: custom
  leftSegments: [pi, vim, model, mode, collab, path, git, pr, context_pct, cost]
  rightSegments: [session_name, cache_hit, cache_read]
