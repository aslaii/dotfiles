# omp-budget opt-in overlay (native `--config` overlay, no source edits).
#
# Stack: Claude Sonnet 5 through the $20/mo Claude subscription's OAuth
# credential (`claude-sdk-oauth`, provider `anthropic`) first for the
# driving roles, OpenCode Go DeepSeek V4.1 Flash once Claude's usage-aware
# preflight reports the account exhausted, and Go's
# Muse Spark 1.3 Contributor for grunt lanes.
# No OpenAI/GPT model or paid Zen model in this file.
#
#   omp --config /Users/aslaii/dotfiles/omp/budget.yml ...
# or through the shell function:
#   omp-budget
#
# Precedence (src/config/settings.ts #rebuildMerged): global config.yml <
# project settings < THIS overlay < runtime overrides. Nested objects merge
# per key, so only the roles/chains named here change; everything else
# (disabledProviders, plugins, UI, thinking levels) is inherited untouched.
modelRoles:
  # Reasoning-heavy work -> Claude Sonnet 5 (subscription quota) first.
  plan: anthropic/claude-sonnet-5:high
  planner: anthropic/claude-sonnet-5:high
  slow: anthropic/claude-sonnet-5:high
  review: anthropic/claude-sonnet-5:high
  # Designer stays on Go's DeepSeek Flash tier: highest-volume iterative
  # role here, no concrete reason to spend subscription quota on it, and the
  # global profile already gives designer its own Claude routing (Opus-5)
  # when the caller wants that instead of this budget overlay.
  designer: opencode-go/deepseek-v4.1-flash:max
  task: anthropic/claude-sonnet-5:medium
  # Advisor stays off Claude: high turn volume, long-running threads.
  advisor: opencode-go/deepseek-v4.1-flash:high
  # Main stays on Claude's mid tier too.
  default: anthropic/claude-sonnet-5:medium
  # Vision reads stay off Claude: Go's DeepSeek V4.1 Flash accepts images.
  vision: opencode-go/deepseek-v4.1-flash:high
  # Grunt work -> plan-hosted Muse Contributor, the plan's cheapest capable model.
  smol: opencode-go/muse-spark-1.3-contributor:xhigh
  commit: opencode-go/muse-spark-1.3-contributor:medium
  tiny: opencode-go/muse-spark-1.3-contributor:medium
  verify: opencode-go/muse-spark-1.3-contributor:xhigh
  research: opencode-go/muse-spark-1.3-contributor:xhigh
  free: opencode-go/muse-spark-1.3-contributor:xhigh
retry:
  # Hard-require the fallback machinery (startup resolution is gated on this).
  modelFallback: true
  # Usage-aware preflight, same keys/values as agent/config.yml's global
  # profile (settings-schema.ts #1912-1970): before a call on a coding-plan
  # model, check the active credential's remaining usage; only at 0%
  # remaining, with policy "auto", silently advance to
  # the next `fallbackChains` entry instead of erroring or prompting.
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  fallbackChains:
    default:
      - opencode-go/deepseek-v4.1-flash:high
      - opencode-go/muse-spark-1.3-contributor:xhigh
    opencode-go/glm-5.3-flash:
      - opencode-go/deepseek-v4.1-flash:high
      - opencode-go/muse-spark-1.3-contributor:xhigh
    opencode-go/deepseek-v4.1-flash:
      - opencode-go/glm-5.3-flash:off
      - opencode-go/muse-spark-1.3-contributor:xhigh
    # Claude Sonnet 5 -> Go DeepSeek Flash -> Go Muse.
    anthropic/*:
      - opencode-go/deepseek-v4.1-flash:high
      - opencode-go/muse-spark-1.3-contributor:xhigh
    openai-codex/*:
      - opencode-go/deepseek-v4.1-flash:high
      - opencode-go/muse-spark-1.3-contributor:xhigh
    opencode-go/muse-spark-1.3-contributor:
      - opencode-go/deepseek-v4.1-flash:high
