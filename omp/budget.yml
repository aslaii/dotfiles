# omp-budget opt-in overlay (native `--config` overlay, no source edits).
#
# Stack: Command Code $10 plan DeepSeek tier for reasoning roles, the
# plan-hosted Muse Spark 1.3 Contributor (commandcode/meta/muse-spark-1.3-contributor)
# for grunt lanes, free OpenCode Zen Muse Contributor as last-resort backstop.
# No x-cmd-zdr header (opt-in on Command Code; most models default to ZDR;
# forcing it caps a model at the plan's default allowance).
# No Anthropic, OpenAI, GPT, Claude, or paid Zen model in this file.
#
#   omp --config /Users/aslaii/dotfiles/omp/budget.yml ...
# or through the shell function:
#   omp-budget
#
# Precedence (src/config/settings.ts #rebuildMerged): global config.yml <
# project settings < THIS overlay < runtime overrides. Nested objects merge
# per key, so only the roles/chains named here change; everything else
# (disabledProviders, plugins, UI, thinking levels) is inherited untouched.
modelRoles:
  # Reasoning-heavy work -> Command Code plan, top thinking tier.
  plan: commandcode/deepseek/deepseek-v4.1-flash:max
  planner: commandcode/deepseek/deepseek-v4.1-flash:max
  slow: commandcode/deepseek/deepseek-v4.1-flash:max
  review: commandcode/deepseek/deepseek-v4.1-flash:max
  designer: commandcode/deepseek/deepseek-v4.1-flash:max
  task: commandcode/deepseek/deepseek-v4.1-flash:high
  advisor: commandcode/deepseek/deepseek-v4.1-flash:high
  # Main stays on the plan's cheapest tier.
  default: commandcode/deepseek/deepseek-v4.1-flash:medium
  # Vision reads use the plan's dedicated, image-probe-verified vision model.
  vision: commandcode/deepseek/deepseek-v4-flash-vision-exp:high
  # Grunt work -> plan-hosted Muse Contributor, the plan's cheapest capable model.
  smol: commandcode/meta/muse-spark-1.3-contributor:xhigh
  commit: commandcode/meta/muse-spark-1.3-contributor:medium
  tiny: commandcode/meta/muse-spark-1.3-contributor:medium
  verify: commandcode/meta/muse-spark-1.3-contributor:xhigh
  research: commandcode/meta/muse-spark-1.3-contributor:xhigh
  free: commandcode/meta/muse-spark-1.3-contributor:xhigh
retry:
  # Hard-require the fallback machinery (startup resolution is gated on this),
  # and pin the chains to the plan's DeepSeek family and free Muse only.
  modelFallback: true
  fallbackChains:
    default:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/deepseek/deepseek-v4-pro:high
      - commandcode/deepseek/deepseek-v4-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/deepseek/deepseek-v4.1-flash:
      - commandcode/deepseek/deepseek-v4-pro:max
      - commandcode/deepseek/deepseek-v4-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/deepseek/deepseek-v4-pro:
      - commandcode/deepseek/deepseek-v4.1-flash:max
      - commandcode/deepseek/deepseek-v4-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/deepseek/deepseek-v4-flash-vision-exp:
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
      - commandcode/deepseek/deepseek-v4.1-flash:medium
    commandcode/deepseek/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    anthropic/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    openai-codex/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/meta/muse-spark-1.3-contributor:
      - commandcode/deepseek/deepseek-v4.1-flash:medium
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    opencode-zen/muse-spark-1.3-contributor-free:
      - commandcode/meta/muse-spark-1.3-contributor:xhigh
      - commandcode/deepseek/deepseek-v4.1-flash:high
    opencode-zen/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
