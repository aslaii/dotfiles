# omp-budget opt-in overlay (native `--config` overlay, no source edits).
#
# A whole-catalog plan profile: every model role and every fallback edge
# resolves to a Command Code $10 plan model (registered via the native
# openai-models-list discovery in agent/models.yml, ~69 ids) or the free
# OpenCode Zen Muse Contributor endpoint. Heavy lanes (plan/review/designer)
# run the plan's Claude Opus 5; mid lanes (slow/task/advisor) run Claude
# Sonnet 5; cheap lanes fall back across DeepSeek/GLM/Qwen/MiniMax/Kimi;
# grunt work (smol/commit/tiny/verify/research/free) stays on the free Muse
# endpoint. No role or fallback edge can reach the anthropic, openai-codex,
# or any paid Zen provider - the global config's Claude/GPT roles are
# overridden below.
#
#   omp --config /Users/aslaii/dotfiles/omp/budget.yml ...
# or through the shell function:
#   omp-budget
#
# Precedence (src/config/settings.ts #rebuildMerged): global config.yml <
# project settings < THIS overlay < runtime overrides. Nested objects merge
# per key, so only the roles/chains named here change; everything else
# (disabledProviders, plugins, UI, thinking levels) is inherited untouched.
modelRoles:
  # Reasoning-heavy work -> plan's Claude Opus 5, top thinking tiers.
  plan: commandcode/claude-opus-5:xhigh
  planner: commandcode/claude-opus-5:high
  review: commandcode/claude-opus-5:xhigh
  designer: commandcode/claude-opus-5:high
  # Sustained task work -> plan's Claude Sonnet 5.
  slow: commandcode/claude-sonnet-5:high
  task: commandcode/claude-sonnet-5:high
  advisor: commandcode/claude-sonnet-5:medium
  # Main + image reading stay on the plan's cheapest tier.
  default: commandcode/deepseek/deepseek-v4.1-flash:medium
  vision: commandcode/deepseek/deepseek-v4.1-flash:medium
  # Grunt work -> free Muse Contributor, zero plan spend.
  smol: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  commit: opencode-zen/muse-spark-1.3-contributor-free:medium
  tiny: opencode-zen/muse-spark-1.3-contributor-free:medium
  verify: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  research: opencode-zen/muse-spark-1.3-contributor-free:xhigh
  free: opencode-zen/muse-spark-1.3-contributor-free:xhigh
retry:
  # Hard-require the fallback machinery (startup resolution is gated on this),
  # and pin the chains to plan-catalog and free-Muse providers only.
  modelFallback: true
  fallbackChains:
    default:
      - commandcode/claude-sonnet-5:high
      - commandcode/gpt-5.6-sol:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/moonshotai/Kimi-K3:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/claude-opus-5:
      - commandcode/claude-sonnet-5:high
      - commandcode/gpt-5.6-sol:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/claude-sonnet-5:
      - commandcode/gpt-5.6-sol:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/zai-org/GLM-5.3:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/gpt-5.6-*:
      - commandcode/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    commandcode/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/zai-org/GLM-5.3:high
      - commandcode/Qwen/Qwen3.8-Max:high
      - commandcode/MiniMaxAI/MiniMax-M3:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    anthropic/*:
      - commandcode/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    openai-codex/*:
      - commandcode/claude-sonnet-5:high
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - opencode-zen/muse-spark-1.3-contributor-free:xhigh
    opencode-zen/muse-spark-1.3-contributor-free:
      - commandcode/deepseek/deepseek-v4.1-flash:medium
      - commandcode/claude-sonnet-5:high
    opencode-zen/*:
      - commandcode/deepseek/deepseek-v4.1-flash:high
      - commandcode/claude-sonnet-5:high
