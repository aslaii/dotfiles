model = "gpt-5.4"
model_reasoning_effort = "high"
personality = "pragmatic"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
multi_agent = true
unified_exec = true
shell_snapshot = true
steer = true

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/Users/aslaii/dotfiles"]
startup_timeout_sec = 20.0
tool_timeout_sec = 60.0

[tui]
theme = "catppuccin-mocha"
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "five-hour-limit"]
