# Options to make tmux more pleasant
set -g mouse on
set -g history-limit 500
set -g status-position top
set -g status-interval 5
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#T "

# --- Set Day/Night Theme for Catppuccin ---
set -g @catppuccin_flavor "latte"
set -g @catppuccin_flavour_module "flavour"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "
set -ogq @catppuccin_window_current_text " #T"
set -ogq @catppuccin_window_current_number "#I"

run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#($HOME/dotfiles/tmux/sync_theme.sh >/dev/null 2>&1)"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'catppuccin/tmux#v2.1.2'
run-shell -b '$HOME/dotfiles/tmux/sync_theme.sh >/dev/null 2>&1'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
